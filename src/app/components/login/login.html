<h1>Login</h1>
<section>
    <h1>Enter your account details</h1>
    <form>
        <fieldset>
            <label for="username">Username:</label>
            <input type="text" name="username">
        </fieldset>
        <fieldset>
            <label for="password">Password:</label>
            <input type="password" name="password">
        </fieldset>
        <button>Submit</button>
    </form>
</section>
